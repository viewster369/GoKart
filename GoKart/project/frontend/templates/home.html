<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoKart — Home</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'DotGothic16', sans-serif;
            background: #f3f3f3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #bbb 1.2px, transparent 1.2px);
            background-size: 36px 36px;
            opacity: .35;
            pointer-events: none;
        }

        nav.topnav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            background: rgba(243, 243, 243, .92);
            backdrop-filter: blur(8px);
            z-index: 100;
            border-bottom: 1px solid #e5e5e5;
        }

        .nav-brand {
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #111;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111;
            transition: .2s;
        }

        .nav-links a:hover {
            background: #111;
            color: #f3f3f3;
        }

        .nav-links a.dk {
            background: #111;
            color: #f3f3f3;
        }

        .nav-links a.dk:hover {
            background: #333;
        }

        .nav-user {
            font-family: 'DotGothic16', sans-serif;
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
            padding: 7px 14px;
            border-radius: 20px;
            background: rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
            display: inline-flex;
            align-items: center;
        }

        /* ── SEARCH BAR ── */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 180px;
            transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-left: 12px;
        }
        .search-container:focus-within {
            max-width: 280px;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            color: #888;
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: transform .3s ease, color .3s ease;
        }
        .search-container:focus-within .search-icon {
            transform: scale(1.15);
            color: #111;
        }
        .nav-search-input {
            width: 100%;
            height: 38px;
            padding: 0 16px 0 42px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(0,0,0,0.04);
            font-family: 'DotGothic16', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            outline: none;
            transition: all .3s ease;
            color: #111;
        }
        .nav-search-input:focus {
            background: #fff;
            border-color: #111;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .nav-search-input::placeholder {
            color: #999;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 10px;
        }

        .card {
            background: #d7d4d4;
            padding: 54px;
            width: 420px;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .08);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .card h1 {
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 8px
        }

        .sub {
            font-size: 12px;
            color: #888;
            letter-spacing: .5px;
            margin-bottom: 6px
        }

        .email-tag {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 32px
        }

        nav {
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center
        }

        nav a {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 20px;
            text-decoration: none;
            background: #111;
            color: #f3f3f3;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: .2s;
        }

        nav a:hover {
            background: #333
        }

        nav a.out {
            background: transparent;
            border: 2px solid #111;
            color: #111
        }

        nav a.out:hover {
            background: #111;
            color: #f3f3f3
        }

        #logoutBtn {
            cursor: pointer
        }

        .loading {
            font-size: 12px;
            color: #888;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <nav class="topnav">
        <div style="display: flex; align-items: center;">
            <a href="index.html" class="nav-brand">goKart</a>
            <div class="search-container">
                <div class="search-icon">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" id="searchInput" class="nav-search-input" placeholder="Search...">
            </div>
        </div>
        <div class="nav-links">
            <span class="nav-user" id="navUser"></span>
            <a href="dashboard.html">Browse</a>
            <a href="cart.html">Cart</a>
            <a href="#" class="dk" id="navLogout">Logout</a>
        </div>
    </nav>

    <div class="card">
        <p class="loading" id="loading">Loading…</p>
        <div id="content" style="display:none">
            <h1>You're In</h1>
            <p class="sub" id="welcomeText"></p>
            <p class="email-tag" id="emailTag"></p>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="index.html" class="out">Browse</a>
                <a href="#" id="logoutBtn">Logout</a>
            </nav>
            <a href="dashboard.html" class="out"
                style="display:inline-block;padding:10px 22px;border-radius:20px;text-decoration:none;border:2px solid #111;color:#111;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:.2s;"
                onmouseover="this.style.background='#111';this.style.color='#f3f3f3'"
                onmouseout="this.style.background='transparent';this.style.color='#111'">View Recommendations</a>
        </div>
    </div>

    <script>
        (async () => {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const user = await res.json();
                    document.getElementById('navUser').textContent = 'Hi, ' + user.name.split(' ')[0];
                    document.getElementById('userName').textContent = 'Welcome back, ' + user.name + '!';
                    document.getElementById('userEmail').textContent = user.email;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';

                    document.getElementById('navLogout').addEventListener('click', async e => {
                        e.preventDefault();
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = 'login.html';
                    });
                    document.getElementById('logoutBtn').addEventListener('click', async e => {
                        e.preventDefault();
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = 'login.html';
                    });
                } else {
                    window.location.href = 'login.html';
                }
            } catch {
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>

</html>
