<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoKart — Cart</title>

    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DotGothic16', sans-serif;
            background: #f3f3f3;
            min-height: 100vh;
        }

        nav.topnav {
            position: sticky;
            top: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            background: rgba(243, 243, 243, .92);
            backdrop-filter: blur(8px);
            z-index: 100;
            border-bottom: 1px solid #e5e5e5;
        }

        .nav-brand {
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #111;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111;
            transition: .2s;
        }

        .nav-links a:hover {
            background: #111;
            color: #f3f3f3;
        }

        .nav-links a.dk {
            background: #111;
            color: #f3f3f3;
        }

        .nav-links a.dk:hover {
            background: #333;
        }

        .nav-user {
            font-family: 'DotGothic16', sans-serif;
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
            padding: 7px 14px;
            border-radius: 20px;
            background: rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
            display: inline-flex;
            align-items: center;
        }

        /* ── SEARCH BAR ── */
        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 180px;
            transition: all .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-left: 12px;
        }
        .search-container:focus-within {
            max-width: 280px;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            color: #888;
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: transform .3s ease, color .3s ease;
        }
        .search-container:focus-within .search-icon {
            transform: scale(1.15);
            color: #111;
        }
        .nav-search-input {
            width: 100%;
            height: 38px;
            padding: 0 16px 0 42px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(0,0,0,0.04);
            font-family: 'DotGothic16', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            outline: none;
            transition: all .3s ease;
            color: #111;
        }
        .nav-search-input:focus {
            background: #fff;
            border-color: #111;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .nav-search-input::placeholder {
            color: #999;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 10px;
        }

        .page-header {
            padding: 48px 60px 22px;
            border-bottom: 1px solid #e8e8e8;
        }

        .page-header h1 {
            font-size: 32px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .page-header p {
            font-size: 12px;
            color: #888;
            letter-spacing: .5px;
        }

        .cart-container {
            padding: 36px 60px 80px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .cart-items {
            flex: 1;
            min-width: 300px;
        }

        .cart-summary {
            width: 350px;
            background: #d7d4d4;
            padding: 32px;
            border-radius: 20px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .cart-item {
            display: flex;
            background: #d7d4d4;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 16px;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.45);
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 15px;
            margin-bottom: 6px;
            color: #111;
            text-decoration: none;
        }

        .item-name:hover {
            text-decoration: underline;
        }

        .item-price {
            font-size: 12px;
            opacity: 0.7;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qty-btn {
            background: #111;
            color: #f3f3f3;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-family: inherit;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #d40000;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .item-total-price {
            font-size: 14px;
            font-weight: bold;
            margin-right: 20px;
        }

        .summary-title {
            font-size: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 12px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: bold;
            border-top: 1px solid #ccc;
            padding-top: 12px;
            margin-top: 12px;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #111;
            color: #f3f3f3;
            border: none;
            border-radius: 14px;
            margin-top: 24px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #333;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 0;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

    <nav class="topnav">
        <div style="display: flex; align-items: center;">
            <a href="index.html" class="nav-brand">goKart</a>
            <div class="search-container">
                <div class="search-icon">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" id="searchInput" class="nav-search-input" placeholder="Search...">
            </div>
        </div>
        <div class="nav-links">
            <span class="nav-user" id="navUser"></span>
            <a href="dashboard.html">Browse</a>
            <a href="cart.html" class="dk">Cart (<span id="cartCount">0</span>)</a>
            <a href="#" class="dk" id="navLogout" style="background:transparent; color:#111; border:1px solid #111">Logout</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Your Cart</h1>
        <p>Review your selected items</p>
    </div>

    <div class="cart-container">
        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">
            <div class="summary-title">Order Summary</div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0</span>
            </div>

            <div class="summary-row">
                <span>Taxes</span>
                <span>Calculated at checkout</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span id="total">$0</span>
            </div>

            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        // ═══ SVG PLACEHOLDER GENERATOR ════════════════════════════════════
        const _phColors = {
            Electronics: ['#1a1a2e','#e94560'], Fashion: ['#2d132c','#ee4c7c'],
            Home: ['#2d4059','#ea5455'], Books: ['#3c1642','#e94560'],
            Beauty: ['#6a097d','#f5c7f7'], Sports: ['#0f3460','#e94560'],
        };
        const _phIcons = {
            Electronics:'⚡', Fashion:'👗', Home:'🏠', Books:'📚', Beauty:'✨', Sports:'🏅',
        };
        function generatePlaceholder(title, category) {
            const [bg, fg] = _phColors[category] || ['#333','#fff'];
            const icon = _phIcons[category] || '📦';
            const label = (title || 'Product').substring(0, 30);
            const escaped = label.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const catLabel = (category || 'General').replace(/&/g,'&amp;');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}" rx="12"/><text x="200" y="160" text-anchor="middle" font-size="64" fill="${fg}" opacity="0.3">${icon}</text><text x="200" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="${fg}">${escaped}</text><text x="200" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="${fg}" opacity="0.6">${catLabel}</text></svg>`;
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }
        function handleImgError(imgEl, title, category) {
            imgEl.onerror = null;
            imgEl.src = generatePlaceholder(title, category);
        }

        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        const cartCountEl = document.getElementById('cartCount');
        const subtotalEl = document.getElementById('subtotal');
        const totalEl = document.getElementById('total');
        const cartContainer = document.getElementById('cartItems');

        function updateCartCount() {
            cartCountEl.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }

            saveCart();
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            saveCart();
        }

        function parsePrice(priceVal) {
            if (typeof priceVal === 'number') return priceVal;
            if (typeof priceVal !== 'string') return 0;
            return Number(priceVal.replace(/[^0-9.]/g, '')) || 0;
        }

        function formatPrice(num) {
            return `$${num.toLocaleString('en-US')}`;
        }

        function checkout() {
            if (!cart.length) {
                alert('Your cart is empty!');
                return;
            }
            alert('Checkout functionality coming soon!');
        }

        function renderCart() {
            if (!cart.length) {
                cartContainer.innerHTML = `
                    <div class="empty-cart">
                        Your cart is empty. <br><br>
                        <a href="dashboard.html" style="color:#111">Browse products</a>
                    </div>`;
                subtotalEl.textContent = '$0';
                totalEl.textContent = '$0';
                return;
            }

            let total = 0;

            cartContainer.innerHTML = cart.map(item => {
                const itemTotal = parsePrice(item.price) * item.qty;
                total += itemTotal;
                const id = String(item.id ?? '');
                const safeId = id.replace(/'/g, "\\'");
                const name = item.title || item.name || 'Product';
                const cat = item.category || 'General';
                const image = item.image || item.img || generatePlaceholder(name, cat);

                return `
                    <div class="cart-item">
                        <img src="${image}" alt="${name}"
                            onerror="handleImgError(this,'${name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}','${cat}')">

                        <div class="item-details">
                            <a href="product.html?id=${encodeURIComponent(id)}" class="item-name">${name}</a>
                            <div class="item-price">${item.price}</div>
                        </div>

                        <div class="item-actions">
                            <button class="qty-btn" onclick="updateQty('${safeId}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty('${safeId}', 1)">+</button>
                        </div>

                        <div class="item-total-price">${formatPrice(itemTotal)}</div>
                        <button class="remove-btn" onclick="removeItem('${safeId}')">Drop</button>
                    </div>
                `;
            }).join('');

            subtotalEl.textContent = formatPrice(total);
            totalEl.textContent = formatPrice(total);
        }

        // ── Auth & Search Initialization ──
        (async () => {
            try {
                const meRes = await fetch('/api/me');
                if (meRes.ok) {
                    const user = await meRes.json();
                    document.getElementById('navUser').textContent = 'Hi, ' + user.name.split(' ')[0];
                    document.getElementById('navLogout').addEventListener('click', async e => {
                        e.preventDefault();
                        await fetch('/api/logout', { method: 'POST' });
                        window.location.href = 'login.html';
                    });
                } else {
                    const nl = document.getElementById('navLogout');
                    if (nl) {
                        nl.textContent = 'Login';
                        nl.href = 'login.html';
                    }
                }
            } catch { }

            // Handle Global Search from Header
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const term = searchInput.value.trim();
                        if (term) {
                            window.location.href = `dashboard.html?search=${encodeURIComponent(term)}`;
                        }
                    }
                });
            }
        })();

        updateCartCount();
        renderCart();
    </script>

</body>

</html>
